# GitHub Actions CI/CD Pipeline for InfoMAE
name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10']
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run installation test
      run: |
        python test_installation.py
        
    - name: Check code style (optional)
      if: matrix.python-version == '3.9'
      run: |
        pip install black flake8
        black --check *.py models/*.py data/*.py utils/*.py || true
        flake8 --max-line-length=120 *.py || true
        
    - name: Test imports
      run: |
        python -c "from models.infomae import InfoMAE; print('✓ InfoMAE import successful')"
        python -c "from config import get_config; print('✓ Config import successful')"
        python -c "from engine import Trainer; print('✓ Engine import successful')"
        
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - name: Install linting tools
      run: |
        pip install black flake8 isort
    - name: Run black
      run: black --check . || true
    - name: Run flake8
      run: flake8 --max-line-length=120 . || true
    - name: Run isort
      run: isort --check-only . || true

